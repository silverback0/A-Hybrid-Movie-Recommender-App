plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode =
        localProperties.getProperty(
                'flutter.versionCode'
        ) ?: '1'

def flutterVersionName =
        localProperties.getProperty(
                'flutter.versionName'
        ) ?: '1.0'

android {

    namespace "com.example.my_movie_recommender_app"

    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.example.my_movie_recommender_app"

        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.java.srcDirs += 'src/main/java'
        main.aidl.srcDirs += 'src/main/aidl'
        main.res.srcDirs += 'src/main/res'
        main.assets.srcDirs += 'src/main/assets'
        main.manifest.srcFile 'src/main/AndroidManifest.xml'
    }

    signingConfigs {
        release {
            keyAlias 'my-key-alias'
            keyPassword '@Muchach0j1'
            storeFile file(
                'C:/Users/chris/OneDrive/Documents/my projects/project 1/my_movie_recommender_app/my-release-key.keystore'
            )
            storePassword '@Muchach0j1'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    implementation 'com.google.firebase:firebase-analytics:20.0.1'
    implementation 'com.google.firebase:firebase-core:20.0.1'
}